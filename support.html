<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support - Order Management System</title>
    <link rel="stylesheet" href="styles.css?v=r6">
</head>
<body>
    <div class="login-container">
        <div class="login-box" style="width: 500px; max-width: 90%; background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
            <div class="login-header">
                <h1>Support Center</h1>
                <p>How can we help you today?</p>
            </div>
            
            <form id="supportForm" style="margin-top: 20px;">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label for="email">Email ID</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required placeholder="Describe your issue" style="width: 100%; padding: 14px; border: none; border-radius: 12px; background: rgba(240, 240, 245, 0.8); font-size: 16px; box-shadow: inset 0 3px 6px rgba(0,0,0,0.1), 0 1px 0 rgba(255,255,255,1); min-height: 120px; font-family: inherit; transition: all 0.3s ease;"></textarea>
                </div>
                <button type="button" class="btn-primary" onclick="alert('Message sent to support team! We will get back to you shortly.'); window.history.back();" style="width: 100%; margin-bottom: 10px;">Send Message</button>
                <button type="button" class="btn-secondary" onclick="window.history.back()" style="width: 100%;">Back</button>
            </form>
        </div>
    </div>
</body>
</html>
