<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Order Management System</title>
    <link rel="stylesheet" href="styles.css?v=r8">
    <style>
        .dashboard-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            animation: fadeIn 0.5s ease-out;
        }

        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.9);
            padding: 1.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            backdrop-filter: blur(10px);
        }

        .dash-header h1 {
            margin: 0;
            color: #2c3e50;
            font-size: 2rem;
            font-weight: 700;
        }
        
        .dash-nav button {
            background: #f1f5f9;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            color: #475569;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: 10px;
        }

        .dash-nav button:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }

        .dash-nav button.primary {
            background: #ff5722;
            color: white;
        }

        .dash-nav button.primary:hover {
            background: #f4511e;
        }

        .dash-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .dash-card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .dash-card:hover {
            transform: translateY(-5px);
        }

        .dash-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
        }

        .dash-card.orders::before { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
        .dash-card.revenue::before { background: linear-gradient(90deg, #10b981, #34d399); }
        .dash-card.tables::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }

        .dash-icon {
            font-size: 3rem;
            margin-right: 1.5rem;
            background: #f8fafc;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
        }

        .dash-info h3 {
            margin: 0;
            color: #64748b;
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dash-info .value {
            font-size: 2.5rem;
            font-weight: 800;
            color: #1e293b;
            margin-top: 0.5rem;
        }

        .dash-section {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
        }

        .dash-section h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #1e293b;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
        }

        .dash-section h2 span {
            margin-right: 10px;
        }

        #dashRecentOrdersList {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .recent-order-item {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .recent-order-item:hover {
            background: #f1f5f9;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body style="background: #f1f5f9;">
    <div class="dashboard-wrapper" id="dashboardContainer">
        <header class="dash-header">
            <h1>Restaurant Dashboard</h1>
            <div class="dash-nav">
                <span id="userDisplay" style="font-weight: 600; color: #64748b; margin-right: 15px;">User</span>
                <button onclick="transitionToPage('tables.html')">🪑 Table Management</button>
                <button class="primary" onclick="logout()">🚪 Logout</button>
            </div>
        </header>

        <div class="dash-grid">
            <!-- Total Orders -->
            <div class="dash-card orders">
                <div class="dash-icon">📦</div>
                <div class="dash-info">
                    <h3>Total Orders</h3>
                    <div class="value" id="dashTotalOrders">0</div>
                </div>
            </div>

            <!-- Total Payment -->
            <div class="dash-card revenue">
                <div class="dash-icon">💰</div>
                <div class="dash-info">
                    <h3>Total Revenue</h3>
                    <div class="value" id="dashTotalPayment">₹0</div>
                </div>
            </div>

            <!-- Tables Available -->
            <div class="dash-card tables">
                <div class="dash-icon">🪑</div>
                <div class="dash-info">
                    <h3>Tables Available</h3>
                    <div class="value" id="dashAvailableTables">0 / 0</div>
                </div>
            </div>
        </div>

        <div class="dash-section">
            <h2><span>📋</span> Recent Orders</h2>
            <div id="dashRecentOrdersList">
                <div style="color: #64748b; padding: 1rem; text-align: center;">Loading...</div>
            </div>
        </div>
    </div>

    <script type="module" src="firebase-config.js?v=r8"></script>`r`n    <script src="data.js?v=r8"></script>
    <script src="script.js?v=r8"></script>
</body>
</html>
