<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preparation Tracking - Order Management System</title>
    <link rel="stylesheet" href="styles.css?v=r10">
</head>
<body class="table-page">
    <div class="container">
        <header class="tracking-header">
            <div class="header-titles">
                <h1>👨‍🍳 Food Preparation Tracking - <span class="highlight-text" id="orderIdDisplay">Order</span></h1>
                <p class="subtitle">Track your order from kitchen to table</p>
            </div>
            <div class="header-actions">
                <button class="btn-blue-gradient" onclick="goBackToFoodSelection()">← BACK TO MENU</button>
            </div>
        </header>

        <main>
            <div class="tracking-container">
                <div class="summary-card" style="animation: slideInUp 0.6s ease-out forwards; opacity: 0;">
                    <div class="summary-item">
                        <div class="summary-icon dome-icon">🛎️</div>
                        <div class="summary-text">
                            <span class="label">Order ID</span>
                            <span class="value" id="trackingOrderId"></span>
                        </div>
                    </div>
                    <div class="summary-divider"></div>
                    <div class="summary-item">
                        <div class="summary-icon table-icon">🍽️</div>
                        <div class="summary-text">
                            <span class="label">Table Number</span>
                            <span class="value">Table - <span id="trackingTableNumber"></span></span>
                        </div>
                    </div>
                    <div class="summary-item items-count-pill">
                        <span class="icon">🕒</span> Total Items : <span id="trackingTotalItems"></span>
                    </div>
                </div>

                <div class="tracking-items" id="trackingItemsContainer" style="animation: slideInUp 0.6s ease-out 0.2s forwards; opacity: 0;">
                    <!-- Tracking items will be displayed here -->
                </div>
            </div>
        </main>
    </div>

    <script src="data.js?v=r10"></script>
    <script src="script.js?v=r10"></script>
</body>
</html>
