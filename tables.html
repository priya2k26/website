<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Management - Order Management System</title>
    <link rel="stylesheet" href="styles.css?v=r8">
</head>
<body style="background: #ffffff;">
    <div class="ready-orders-page-wrapper">
        <header class="ro-header-card">
            <div class="ro-header-left">
                <div class="ro-header-icon">
                    🪑<div class="ro-icon-check">✓</div>
                </div>
                <div class="ro-header-text">
                    <h1>Table Management</h1>
                    <p>Select an available table to start an order.</p>
                </div>
            </div>
            <div class="ro-header-actions">
                <span id="userDisplay" style="font-weight: 600; color: #555;">User</span>
                <button class="ro-btn-logout" onclick="logout()" style="margin-left:15px;">
                    🚪 LOGOUT
                </button>
            </div>
        </header>

        <main class="ro-main-card">
            <div class="ro-main-header">
                <div class="ro-main-title">
                    <span class="ro-table-icon" style="animation: none; color: #ff5722;">🍽️</span>
                    <div>
                        <h2>Table Selection Overview</h2>
                        <p>Check availability and manage active tables</p>
                    </div>
                </div>
            </div>

            <div class="ro-list-container" id="tablesContainer">
                <!-- Tables will be generated by JavaScript -->
            </div>
        </main>
    </div>

    <script src="data.js?v=r8"></script>
    <script src="script.js?v=r8"></script>
</body>
</html>
