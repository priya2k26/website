<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Selection - Order Management System</title>
    <link rel="stylesheet" href="styles.css?v=r5">
</head>
<body class="table-page">
    <div class="container">
        <header class="header">
            <h1>Food Selection - Table <span id="tableNumber"></span></h1>
            <div class="header-actions">
                <button class="btn-back" onclick="goBackToTables()">← Back to Tables</button>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </header>

        <main class="food-selection-layout">
            <div class="food-menu">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Menu</h2>
                </div>
                
                <div class="category-tabs" style="display: flex; gap: 10px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 10px;">
                    <button class="btn-secondary category-tab active" onclick="filterMenu('Main Dish', this)">Main Dish</button>
                    <button class="btn-secondary category-tab" onclick="filterMenu('Side Dish', this)">Side Dish</button>
                    <button class="btn-secondary category-tab" onclick="filterMenu('Drinks', this)">Drinks</button>

                </div>
                
                <div class="time-tabs" id="timeTabsContainer" style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <button class="btn-small time-tab active" onclick="filterTime('Morning', this)">🌅 Morning</button>
                    <button class="btn-small time-tab" onclick="filterTime('Afternoon', this)">☀️ Afternoon</button>
                    <button class="btn-small time-tab" onclick="filterTime('Night', this)">🌙 Night</button>
                </div>
                <div class="menu-items" id="menuContainer">
                    <!-- Food items will be generated by JavaScript -->
                </div>
            </div>

            <div class="selected-items-panel">
                <h2>Selected Items</h2>
                <div class="selected-list" id="selectedItemsList">
                    <!-- Selected items will appear here -->
                </div>
                <div class="selected-items-footer">
                    <p>Total Items: <span id="totalItems">0</span></p>
                    <p>Total Price: ₹<span id="totalPrice">0</span></p>
                    <button class="btn-primary" onclick="proceedToConfirmation()" id="confirmBtn" disabled>
                        Proceed to Confirm
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Full-screen image modal -->
    <div id="imageModal" class="image-modal" onclick="closeImageModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="fullScreenImage">
        <div id="modalCaption"></div>
    </div>

    <script src="data.js?v=r5"></script>
    <script src="script.js?v=r5"></script>
</body>
</html>
