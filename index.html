<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management System - Login</title>
    <!-- We still load styles.css for global fonts but override background in style block -->
    <link rel="stylesheet" href="styles.css?v=r8">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .fairy-login-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
        }

        .fairy-login-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 50px 40px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fairy-login-box h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: 700;
        }

        .fairy-login-box p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            color: #333;
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ff5722;
            background: #fff;
            box-shadow: 0 0 8px rgba(255, 87, 34, 0.2);
        }

        .input-group input::placeholder {
            color: #aaa;
        }

        .btn-glow {
            width: 100%;
            background: #ff5722;
            border: none;
            border-radius: 10px;
            padding: 15px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 87, 34, 0.25);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-glow:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 87, 34, 0.35);
            background: #f4511e;
        }

        .demo-credentials {
            margin-top: 25px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="fairy-login-wrapper">
        <div class="fairy-login-box">
            <h1>Welcome</h1>
            <p>Sign in to continue your journey</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>
                
                <button type="submit" class="btn-glow">LOGIN</button>
            </form>
            
            <div class="demo-credentials">
                Demo: Email: admin@restaurant.com | Password: 123456
            </div>
        </div>
    </div>

    <script src="data.js?v=r8"></script>
    <script src="script.js?v=r8"></script>
</body>
</html>
